# Production backend stack for a single always-on VM (e.g. Oracle Always Free).
# The frontend deploys separately to Vercel.
#
#   Browser ──HTTPS──► Vercel (Next.js)
#                        │  NEXT_PUBLIC_API_BASE = https://${DOMAIN}
#                        ▼
#   Caddy :443 ─auto TLS─► backend:8000 ──► Postgres (private)
#
# Only Caddy (80/443) is exposed. Postgres is never published to the internet.
#
# First run on the VM:
#   cp .env.prod.example .env.prod      # edit DOMAIN, FRONTEND_ORIGIN
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f docker-compose.prod.yml exec backend python -m scripts.import_pincode

services:
  caddy:
    image: caddy:2
    container_name: rrcs-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on: [backend]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: rrcs-db
    environment:
      POSTGRES_USER: bijli
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bijli}
      POSTGRES_DB: bijli_mitra
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bijli -d bijli_mitra"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: rrcs-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://bijli:${DB_PASSWORD:-bijli}@db:5432/bijli_mitra
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  caddy_data:
  caddy_config:
