# Backend stack for local dev and the VPS. The frontend deploys to Vercel
# separately (or run it with `npm run dev` in ./frontend during development).
services:
  db:
    image: postgres:16-alpine
    container_name: rrcs-db
    environment:
      POSTGRES_USER: bijli
      POSTGRES_PASSWORD: bijli
      POSTGRES_DB: bijli_mitra
    # Not published to the host (the backend reaches it on the internal network).
    # To inspect: docker compose exec db psql -U bijli -d bijli_mitra
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bijli -d bijli_mitra"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: rrcs-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://bijli:bijli@db:5432/bijli_mitra
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3200}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
