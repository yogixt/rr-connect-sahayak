# Render Blueprint — fully managed backend + Postgres (no VM, no machine to babysit).
# The Next.js frontend stays on Vercel; point its NEXT_PUBLIC_API_BASE at the
# URL Render gives this service (https://rrcs-backend.onrender.com).
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo -> Apply.
# The backend self-seeds the pincode->ASM mapping on first boot (seed_if_empty),
# so there is no separate import step to run.
#
# Free tier note: the web service cold-starts after ~15 min idle and the free
# Postgres expires ~30 days after creation. Bump both `plan: free` lines to a
# paid plan (e.g. `starter`) when this goes live for the client.

databases:
  - name: rrcs-db
    databaseName: bijli_mitra
    user: bijli
    plan: free
    region: singapore

services:
  - type: web
    name: rrcs-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Async Postgres DSN. config.py normalises the postgresql:// URL Render
      # injects into the +asyncpg form SQLAlchemy needs.
      - key: DATABASE_URL
        fromDatabase:
          name: rrcs-db
          property: connectionString
      # CORS allow-list — must exactly match the Vercel frontend origin.
      - key: FRONTEND_ORIGIN
        value: https://rr-connect-sahayak.vercel.app
